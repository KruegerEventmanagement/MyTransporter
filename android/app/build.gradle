apply plugin: 'com.android.application'

// Version: CI setzt MT_VERSION_CODE/MT_VERSION_NAME (scripts/android-version.mjs).
// Lokal: versionCode 1 / "1.0-local" (nie in den Store hochladen).
def mtVersionCode = (System.getenv("MT_VERSION_CODE") ?: "1").toInteger()
if (mtVersionCode <= 0 || mtVersionCode > 2100000000) {
    throw new GradleException("MT_VERSION_CODE ${mtVersionCode} außerhalb 1..2100000000")
}
def mtVersionName = System.getenv("MT_VERSION_NAME") ?: "1.0-local"

// Release-Signierung ausschließlich über Umgebungsvariablen. Nie Debug-Signierung für Release.
def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
def ksPass = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def keyAlias = System.getenv("ANDROID_KEY_ALIAS")
def keyPass = System.getenv("ANDROID_KEY_PASSWORD")
def signingComplete = [ksPath, ksPass, keyAlias, keyPass].every { it != null && !it.isEmpty() } && file(ksPath).exists()
// Explizit unsigniertes Bundle (nur CI-Prüfung, nicht hochladbar): -PmtUnsignedRelease=true
def unsignedRelease = project.hasProperty("mtUnsignedRelease") && project.property("mtUnsignedRelease") == "true"

android {
    namespace "de.mytransporter.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.mytransporter.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode mtVersionCode
        versionName mtVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signingComplete) {
            release {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias keyAlias
                keyPassword keyPass
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingComplete ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError true
        warningsAsErrors false
        checkReleaseBuilds false
    }
}

gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { t ->
        t.project == project && (t.name ==~ /(bundle|assemble|package)Release.*/)
    }
    if (wantsRelease && !signingComplete && !unsignedRelease) {
        throw new GradleException(
            "Release-Signierung unvollständig: ANDROID_KEYSTORE_PATH (existierende Datei), " +
            "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD setzen " +
            "oder explizit -PmtUnsignedRelease=true für ein unsigniertes Prüf-Bundle.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
