# Ohne Secrets: Tests, Native-Shell-Build, Android-Debug-APK, iOS-Simulator-Build (unsigniert).
# Signierte Store-Builds laufen über Appflow/Xcode/Play – siehe docs/native-store-release.md.
name: native-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: bun install --frozen-lockfile || bun install
      - run: bunx vitest run
      - run: bun run build:native
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  ios-simulator:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile || bun install
      - run: bun run build:native
      - run: npx cap sync ios
      - run: cd ios/App && pod install
      - run: >
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
